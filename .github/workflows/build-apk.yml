name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Nix debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The runner's preinstalled Android SDK is not the flake-pinned API 37 SDK, and the
      # 524 MB APK plus the Nix Android closure need room. Nix supplies the entire toolchain.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'nix/gradle/deps.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build and test
        shell: bash
        run: nix develop --command ./scripts/ci-build-apk.sh

      - name: Collect and verify ABI APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/japanese-anki-0.4-arm64-v8a-debug.apk
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk dist/japanese-anki-0.4-x86_64-debug.apk
          python3 scripts/verify-apk-abi.py dist/japanese-anki-0.4-arm64-v8a-debug.apk arm64-v8a
          python3 scripts/verify-apk-abi.py dist/japanese-anki-0.4-x86_64-debug.apk x86_64
          (
            cd dist
            sha256sum japanese-anki-0.4-arm64-v8a-debug.apk japanese-anki-0.4-x86_64-debug.apk > SHA256SUMS.txt
          )
          stat --printf='%n %s bytes\n' dist/japanese-anki-0.4-arm64-v8a-debug.apk dist/japanese-anki-0.4-x86_64-debug.apk dist/SHA256SUMS.txt

      - name: Write summary
        run: |
          {
            echo "## Japanese Anki 0.4 ABI-split debug APKs"
            echo
            echo "Built from \`$GITHUB_SHA\` with the flake-pinned Android toolchain."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "The emulator artifact is the x86_64 APK; the physical-device artifact is arm64-v8a."
            echo "Both are debug-signed with the CI identity and are not update-compatible with a locally signed build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: japanese-anki-0.4-arm64-v8a-debug-apk
          path: dist/japanese-anki-0.4-arm64-v8a-debug.apk
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: japanese-anki-0.4-x86_64-debug-apk
          path: dist/japanese-anki-0.4-x86_64-debug.apk
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload SHA256SUMS.txt
        uses: actions/upload-artifact@v4
        with:
          name: japanese-anki-0.4-sha256sums
          path: dist/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
