name: Build APK

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
        with:
          cache-scope: lint
      - name: Run lint
        run: nix develop --command ./scripts/ci-gradle.sh :app:lintDebug
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn

  tests:
    name: Tests and design states
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Test CI entry points
        run: python3 scripts/test-ci-scripts.py
      - uses: ./.github/actions/setup-android
        with:
          cache-scope: tests
      - name: Run unit and Compose tests
        run: nix develop --command ./scripts/ci-gradle.sh :app:testDebugUnitTest
      - name: Render design states
        run: nix develop --command ./scripts/ci-gradle.sh :app:renderDesignStates
      - name: Upload test reports and design states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-anki-tests-and-design-states
          path: |
            app/build/reports/tests/
            app/build/test-results/
            build/design-states/
          retention-days: 14
          if-no-files-found: warn

  build:
    name: Nix debug APK
    needs: [lint, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
        with:
          cache-scope: build
      - name: Assemble debug APKs
        run: nix develop --command ./scripts/ci-build-apk.sh --build-only

      - name: Collect and verify ABI APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/japanese-anki-0.4-arm64-v8a-debug.apk
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk dist/japanese-anki-0.4-x86_64-debug.apk
          python3 scripts/verify-apk-abi.py dist/japanese-anki-0.4-arm64-v8a-debug.apk arm64-v8a
          python3 scripts/verify-apk-abi.py dist/japanese-anki-0.4-x86_64-debug.apk x86_64
          (
            cd dist
            sha256sum japanese-anki-0.4-arm64-v8a-debug.apk japanese-anki-0.4-x86_64-debug.apk > SHA256SUMS.txt
          )
          stat --printf='%n %s bytes\n' dist/japanese-anki-0.4-arm64-v8a-debug.apk dist/japanese-anki-0.4-x86_64-debug.apk dist/SHA256SUMS.txt

      - name: Write summary
        run: |
          {
            echo "## Japanese Anki 0.4 ABI-split debug APKs"
            echo
            echo "Built from \`$GITHUB_SHA\` with the flake-pinned Android toolchain."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "The emulator build is the x86_64 APK; the physical-device build is arm64-v8a."
            echo "On a push to \`dev\` both are attached as bare files to the \`dev-${GITHUB_SHA::7}\` pre-release,"
            echo "not as an artifact archive."
            echo "Both are debug-signed with the CI identity and are not update-compatible with a locally signed build."
          } >> "$GITHUB_STEP_SUMMARY"

      # Bare APKs, not a zip. GitHub always packages uploaded artifacts into an archive, so a
      # development build is published as a pre-release whose assets download as the files
      # themselves. Push-only: pull requests have no release to publish.
      - name: Publish development build
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dev-${GITHUB_SHA::7}"
          assets=(
            dist/japanese-anki-0.4-arm64-v8a-debug.apk
            dist/japanese-anki-0.4-x86_64-debug.apk
            dist/SHA256SUMS.txt
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false \
              --title "Development build ${GITHUB_SHA::7}" \
              --notes "Debug build of \`${GITHUB_SHA}\` on \`dev\`.

          - \`arm64-v8a\` — physical devices
          - \`x86_64\` — the API 37 emulator

          Debug-signed with the CI identity; not update-compatible with a locally signed build.
          \`SHA256SUMS.txt\` covers both APKs."
          fi
          echo "::notice title=Development build::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
