<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../shared.css">
</head>
<body>
  <div class="statusbar"><span>9:41</span><span>●●●</span></div>
  <div class="screen">
    <div class="card-preview">
      <div class="card-field">
        <span class="photo-chip" style="width:64px; height:64px; border-radius:12px;"></span>
        <span class="actions"><span class="icon" aria-label="Edit field">✎</span></span>
      </div>
      <div class="divider"></div>
      <div class="card-field">
        <span class="txt"><ruby>毎朝<rt>まいあさ</rt></ruby>コーヒーを<b><ruby>飲<rt>の</rt></ruby>みます</b>。</span>
        <span class="actions"><span class="icon" aria-label="Play audio">▶</span><span class="icon" aria-label="Edit field">✎</span></span>
      </div>
      <div class="divider"></div>
      <div class="card-field">
        <span class="txt" style="display:flex; align-items:center; gap:12px;">
          <span class="word"><ruby>飲<rt>の</rt></ruby>む</span>
          <span class="spark"><svg width="38" height="24" viewBox="0 0 38 24">
            <rect x="2" y="2" width="14" height="20" rx="4" fill="var(--field-bg)" stroke="var(--rule)"/>
            <rect x="20" y="2" width="14" height="20" rx="4" fill="var(--field-bg)" stroke="var(--rule)"/>
            <polyline points="9,9 27,15" fill="none" stroke="var(--pitch-atamadaka)" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="9" cy="9" r="2.1" fill="var(--pitch-atamadaka)"/>
            <circle cx="27" cy="15" r="2.1" fill="none" stroke="var(--pitch-atamadaka)" stroke-width="1.5"/>
          </svg></span>
        </span>
        <span class="actions"><span class="icon" aria-label="Play audio">▶</span><span class="icon" aria-label="Edit field">✎</span></span>
      </div>
      <div class="card-field"><span class="txt">to drink</span><span class="actions"><span class="icon" aria-label="Edit field">✎</span></span></div>
      <div class="divider"></div>
      <div class="card-field"><span class="txt">I drink coffee every morning.</span><span class="actions"><span class="icon" aria-label="Edit field">✎</span></span></div>
    </div>
    <div class="ghost-row">＋ Notes</div>
    <div class="chips"><span class="chip">JLPT::N5</span><span class="chip dashed">＋</span></div>
    <div class="spacer"></div>
    <div class="btn-primary full">Send to AnkiDroid</div>
  </div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="screen-title" style="color:var(--accent)">Definition — 飲む・のむ</div>
    <div class="checkrow"><span class="checkbox checked">✓</span><span>to drink</span></div>
    <div class="checkrow"><span class="checkbox"></span><span>to swallow</span></div>
    <div class="divider"></div>
    <div class="mini">Combined result — editable</div>
    <div class="field-box">to drink</div>
    <div class="btn-primary full">Done</div>
  </div>
</body></html>
