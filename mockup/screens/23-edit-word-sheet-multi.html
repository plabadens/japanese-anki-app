<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../shared.css">
</head>
<body>
  <div class="statusbar"><span>9:41</span><span>●●●</span></div>
  <div class="screen">
    <div class="card-preview">
      <div class="card-field">
        <span class="photo-chip" style="width:64px; height:64px; border-radius:12px;"></span>
        <span class="actions"><span class="icon" aria-label="Edit field">✎</span></span>
      </div>
      <div class="divider"></div>
      <div class="card-field">
        <span class="txt"><ruby>料理<rt>りょうり</rt></ruby>が<b><ruby>上手<rt>じょうず</rt></ruby></b>です。</span>
        <span class="actions"><span class="icon" aria-label="Play audio">▶</span><span class="icon" aria-label="Edit field">✎</span></span>
      </div>
      <div class="divider"></div>
      <div class="card-field">
        <span class="txt" style="display:flex; align-items:center; gap:12px;">
          <span class="word"><ruby>上手<rt>じょうず</rt></ruby></span>
          <span class="spark"><svg width="52" height="24" viewBox="0 0 52 24">
            <rect x="2" y="2" width="14" height="20" rx="4" fill="var(--field-bg)" stroke="var(--rule)"/>
            <rect x="20" y="2" width="14" height="20" rx="4" fill="var(--field-bg)" stroke="var(--rule)"/>
            <rect x="38" y="2" width="14" height="20" rx="4" fill="var(--field-bg)" stroke="var(--rule)"/>
            <polyline points="9,9 27,15 45,15" fill="none" stroke="var(--pitch-atamadaka)" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="9" cy="9" r="2.1" fill="var(--pitch-atamadaka)"/>
            <circle cx="27" cy="15" r="2.1" fill="none" stroke="var(--pitch-atamadaka)" stroke-width="1.5"/>
            <circle cx="45" cy="15" r="2.1" fill="none" stroke="var(--pitch-atamadaka)" stroke-width="1.5"/>
          </svg></span>
        </span>
        <span class="actions"><span class="icon" aria-label="Play audio">▶</span><span class="flag-action" aria-label="About the selected pitch"><span class="flag">!</span></span><span class="icon" aria-label="Edit field">✎</span></span>
      </div>
      <div class="card-field"><span class="txt">skilled, good at</span><span class="actions"><span class="icon" aria-label="Edit field">✎</span></span></div>
      <div class="divider"></div>
      <div class="card-field"><span class="txt">Good at cooking.</span><span class="actions"><span class="flag-action" aria-label="About the offline translation"><span class="flag">!</span></span><span class="icon" aria-label="Edit field">✎</span></span></div>
    </div>
    <div class="ghost-row">＋ Notes</div>
    <div class="chips"><span class="chip">JLPT::N5</span><span class="chip dashed">＋</span></div>
    <div class="spacer"></div>
    <div class="btn-primary full">Send to AnkiDroid</div>
  </div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="screen-title" style="color:var(--accent)">Edit word</div>
    <div class="mini">Change target · hold to select a phrase</div>
    <div class="chips">
      <span class="chip">料理</span><span class="chip">が</span>
      <span class="chip" style="background:var(--accent); color:var(--paper); border-color:var(--accent)">上手</span>
      <span class="chip">です</span>
    </div>
    <div class="btn-ghost">Change dictionary entry</div>
    <div class="divider"></div>
    <div class="pitchopt selected" style="justify-content:center;">
      <svg width="76" height="46" viewBox="0 0 76 46">
        <rect x="4" y="2" width="20" height="26" rx="6" fill="var(--field-bg)" stroke="var(--rule)"/>
        <rect x="28" y="2" width="20" height="26" rx="6" fill="var(--field-bg)" stroke="var(--rule)"/>
        <rect x="52" y="2" width="20" height="26" rx="6" fill="var(--field-bg)" stroke="var(--rule)"/>
        <polyline points="14,9 38,21 62,21" fill="none" stroke="var(--pitch-atamadaka)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="14" cy="9" r="3.2" fill="var(--pitch-atamadaka)"/>
        <circle cx="38" cy="21" r="3.2" fill="none" stroke="var(--pitch-atamadaka)" stroke-width="1.6"/>
        <circle cx="62" cy="21" r="3.2" fill="none" stroke="var(--pitch-atamadaka)" stroke-width="1.6"/>
        <text x="14" y="40" text-anchor="middle" font-size="10.5" fill="var(--ink)">じょ</text>
        <text x="38" y="40" text-anchor="middle" font-size="10.5" fill="var(--ink)">う</text>
        <text x="62" y="40" text-anchor="middle" font-size="10.5" fill="var(--ink)">ず</text>
      </svg>
    </div>
    <div class="pitchopt hb" style="justify-content:center;">
      <svg width="76" height="46" viewBox="0 0 76 46">
        <rect x="4" y="2" width="20" height="26" rx="6" fill="var(--field-bg)" stroke="var(--rule)"/>
        <rect x="28" y="2" width="20" height="26" rx="6" fill="var(--field-bg)" stroke="var(--rule)"/>
        <rect x="52" y="2" width="20" height="26" rx="6" fill="var(--field-bg)" stroke="var(--rule)"/>
        <polyline points="14,21 38,9 62,9" fill="none" stroke="var(--pitch-heiban)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="14" cy="21" r="3.2" fill="none" stroke="var(--pitch-heiban)" stroke-width="1.6"/>
        <circle cx="38" cy="9" r="3.2" fill="var(--pitch-heiban)"/>
        <circle cx="62" cy="9" r="3.2" fill="var(--pitch-heiban)"/>
        <text x="14" y="40" text-anchor="middle" font-size="10.5" fill="var(--ink)">じょ</text>
        <text x="38" y="40" text-anchor="middle" font-size="10.5" fill="var(--ink)">う</text>
        <text x="62" y="40" text-anchor="middle" font-size="10.5" fill="var(--ink)">ず</text>
      </svg>
    </div>
  </div>
</body></html>
