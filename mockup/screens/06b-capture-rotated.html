<style>
  /* Phone rotated 90° clockwise (volume keys now on top). The layout is
     screen-locked — nothing here moves, resizes, or reflows, exactly like a
     normal camera app's viewfinder. Only the asymmetric glyphs (the mode
     label text, the Settings icon) counter-rotate 90° so they stay upright
     for the person holding the phone. The shutter ring and thumbnail swatch
     are rotationally symmetric, so they are untouched. */
  .counter-rotate{display:inline-block; transform:rotate(-90deg);}
</style>

    </div>
