<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../shared.css">
<style>
  .entry-row{border:1px solid var(--rule); border-radius:15px; padding:14px 16px; display:flex; flex-direction:column; gap:4px;}
  .entry-row .head{font-size:16px; font-weight:600;}
  .entry-row .gloss{font-size:14px; color:var(--muted);}
</style>
</head>
<body>
  <div class="statusbar"><span>9:41</span><span>●●●</span></div>
  <div class="screen">
    <div class="screen-title">Target</div>
    <div style="display:flex; gap:12px; align-items:center;">
      <div class="photo-chip"></div>
      <div class="mini"><svg class="mi" viewBox="0 -960 960 960"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg> Also used as the card image — <u>change</u></div>
    </div>
    <div class="field-box">毎朝コーヒーを飲みます。</div>
    <div class="mini">Tap the word to mine. Edit the text above if OCR missed something.</div>
    <div class="chips">
      <span class="chip">毎朝</span><span class="chip">コーヒー</span><span class="chip">を</span>
      <span class="chip" style="background:var(--accent); color:var(--paper); border-color:var(--accent)">飲み</span>
      <span class="chip">ます</span>
    </div>
    <div class="mini">Selected: 飲み → 飲む</div>
    <div class="spacer"></div>
  </div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">飲み — 2 matches</div>
    <div class="entry-row">
      <div class="head">飲む · のむ</div>
      <div class="gloss">to drink; to swallow</div>
    </div>
    <div class="entry-row">
      <div class="head">呑む · のむ</div>
      <div class="gloss">to gulp down; to accept (an offer)</div>
    </div>
    <div class="mini">Tap the entry you meant.</div>
  </div>
</body></html>
